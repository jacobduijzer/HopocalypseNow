name: Spoke - Products - Deploy Products Web App

on: 
  workflow_dispatch:
  push:
    paths:
      - spokes/products/src/**

env:
  AZURE_WEBAPP_NAME: 'app-hn-web-7ijueojaqih3e'  
  AZURE_WEBAPP_PACKAGE_PATH: './spokes/products/src/web/HopocalypseNow.Products.Web'
  AZURE_WEBAPP_SOLUTION_FILE: './spokes/products/src/web/HopocalypseNow.Products.sln'
  DOTNET_VERSION: '8.x' 

permissions:
  id-token: write
  contents: read
      
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v4.1.4

    - name: 'Az CLI login'
      uses: azure/login@v1
      with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Set up .NET 
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
       
    - name: Build with dotnet
      run: dotnet build ${{env.AZURE_WEBAPP_SOLUTION_FILE}} --configuration Release

    - name: dotnet publish
      run: dotnet publish ${{env.AZURE_WEBAPP_SOLUTION_FILE}} --configuration Release --output ${{env.DOTNET_ROOT}}/myapp

    - name: 'Run Azure webapp deploy action using publish profile credentials'
      uses: azure/webapps-deploy@v3.0.1
      with: 
        app-name: ${{ env.AZURE_WEBAPP_NAME }} 
        package: '${{env.DOTNET_ROOT}}/myapp'
      
    - name: logout
      run: |
        az logout

